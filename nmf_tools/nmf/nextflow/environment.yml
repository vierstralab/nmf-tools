name: nmf
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - matplotlib
  - pandas=2.1.0
  - nextflow=23.10.1
  - anndata
  - dask
  - zarr
  - scikit-learn
  - seaborn
  - python=3.10
  - statsmodels
  - scipy
  - tqdm
  - pyyaml
  - wiggletools
  - ucsc-bedgraphtobigwig
  - pip
  - pip:
    - git+https://github.com/vierstralab/nmf-tools.git
    - "genome-tools[anndata] @ git+https://github.com/vierstralab/genome-tools.git@v3.0.0"
